<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Children Preference</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page children-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>Do You Have Any Children 12 or Under?</h1>

        <div class="choice-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="yes">Yes</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="no">No</button>
        </div>

        <a class="back-button" href="dog-shedding.html">Back</a>
      </main>
    </div>

    <script>
      const childrenButtons = document.querySelectorAll(".choice-option");
      const savedChildren = localStorage.getItem("selectedChildrenUnderTwelve");

      childrenButtons.forEach((button) => {
        if (button.dataset.choice === savedChildren) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          childrenButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedChildrenUnderTwelve", button.dataset.choice);
          window.location.href = "other-pets.html";
        });
      });
    </script>
  </body>
</html>
