<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a href="#" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <span class="nav-item">Profile</span>
          <span class="nav-item">Questionnaire</span>
          <span class="nav-item">Best Matches</span>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="hero">
        <section class="hero-copy">
          <h1>Every Pet Deserves a Loving Home</h1>
          <p class="subheading">
            Answer a detailed questionnaire about your preferences and lifestyle
            to discover your perfect pet.
          </p>

          <div class="hero-actions">
            <a href="adoption-choice.html" class="nav-item nav-pill">
              <span class="nav-icon" aria-hidden="true">🔎</span>
              <span>Find Your Match</span>
            </a>

            <a href="#" class="nav-item nav-pill nav-pill-outline">
              <span class="nav-icon" aria-hidden="true">🐾</span>
              <span>Available Pets</span>
            </a>
          </div>
        </section>

        <div class="hero-media">
          <img/> />
        </div>
      </main>
    </div>

    <script>
      localStorage.removeItem("selectedPath");
      localStorage.removeItem("selectedPet");
      localStorage.removeItem("selectedGender");
      localStorage.removeItem("selectedAge");
    </script>
  </body>
</html>
