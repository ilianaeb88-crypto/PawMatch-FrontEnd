<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to PawMatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="account-overlay" aria-label="Account access">
      <div class="account-overlay-card">
        <div class="account-choice-content">
          <p class="account-eyebrow">PAWMATCH</p>
          <h2>Welcome to PawMatch</h2>
          <p class="account-choice-intro">Create an account and begin your search for the perfect companion or log in to continue your search.</p>
          <form class="welcome-signup-form" action="create-account.html">
            <button class="welcome-signup-button" id="welcome-login-button" type="button">Log in</button>
            <button class="welcome-signup-button" type="submit">Sign Up</button>
          </form>
        </div>
      </div>
      <aside class="account-choice-visual" aria-label="Pawmatch pet adoption">
        <p class="account-choice-brand">Pawmatch</p>
        <h3>Find the companion who fits your life.</h3>
        <img src="dog-transparent.png" alt="Dog waiting to be adopted" />
      </aside>
    </section>

    <dialog class="logout-success-dialog" id="logout-success-dialog" aria-labelledby="logout-success-title">
      <h2 id="logout-success-title">You Have Been Successfully Logged Out!</h2>
      <button class="welcome-signup-button" id="dismiss-logout-notice" type="button">Continue</button>
    </dialog>

    <script>
      const logoutSuccessDialog = document.querySelector("#logout-success-dialog");
      if (sessionStorage.getItem("pawmatchLogoutNotice") === "true") {
        sessionStorage.removeItem("pawmatchLogoutNotice");
        logoutSuccessDialog.showModal();
      }
      document.querySelector("#dismiss-logout-notice").addEventListener("click", () => logoutSuccessDialog.close());

      document.querySelector("#welcome-login-button").addEventListener("click", () => {
        window.location.href = "sign-in.html";
      });

      localStorage.removeItem("selectedPath");
      localStorage.removeItem("selectedPet");
      localStorage.removeItem("selectedGender");
      localStorage.removeItem("selectedAge");
      localStorage.removeItem("selectedChildrenUnderTwelve");
      localStorage.removeItem("selectedOtherPets");
      localStorage.removeItem("selectedYardOrWalks");
    </script>
  </body>
</html>
