<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="account-overlay" aria-label="Account access">
      <div class="account-overlay-card">
        <div class="account-choice-content">
          <p class="account-eyebrow">PAWMATCH</p>
          <h2>Sign up</h2>
          <p class="account-choice-intro">Create and account and begin your search for the perfect companion. <a href="sign-in.html">Log in here</a></p>
          <form class="welcome-signup-form" action="create-account.html">
            <label class="visually-hidden" for="welcome-email">Email address</label>
            <input id="welcome-email" name="email" type="email" placeholder="Email address" autocomplete="email" required />
            <button class="welcome-signup-button" type="submit">Sign Up</button>
            <span class="welcome-form-divider">OR</span>
            <button class="welcome-google-button" id="google-sign-in-button" type="button"><span class="google-icon" aria-hidden="true">G</span>Continue with Google</button>
          </form>
          <p class="welcome-form-message" id="welcome-google-message" role="alert" aria-live="polite"></p>
        </div>
      </div>
      <aside class="account-choice-visual" aria-label="Pawmatch pet adoption">
        <p class="account-choice-brand">Pawmatch</p>
        <h3>Find the companion who fits your life.</h3>
        <img src="dog-transparent.png" alt="Dog waiting to be adopted" />
      </aside>
    </section>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      const googleButton = document.querySelector("#google-sign-in-button");
      const googleMessage = document.querySelector("#welcome-google-message");
      const googleClientId = "%VITE_GOOGLE_CLIENT_ID%";
      const configuredApiBaseUrl = "%VITE_API_BASE_URL%";
      const apiBaseUrl = configuredApiBaseUrl.startsWith("%VITE_") ? "http://localhost:4000/api" : configuredApiBaseUrl;

      function showGoogleMessage(message) {
        googleMessage.textContent = message;
      }

      async function finishGoogleSignIn(response) {
        try {
          const apiResponse = await fetch(`${apiBaseUrl}/auth/google`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential: response.credential }),
          });
          const result = await apiResponse.json();
          if (!apiResponse.ok) throw new Error(result.error || "Google sign-in failed.");
          localStorage.setItem("pawmatchToken", result.token);
          localStorage.setItem("pawmatchAccount", JSON.stringify(result.user));
          window.location.href = "home.html";
        } catch (error) {
          showGoogleMessage(error.message);
          googleButton.disabled = false;
        }
      }

      function initializeGoogleSignIn() {
        if (googleClientId.startsWith("%VITE_")) {
          showGoogleMessage("Google sign-in is not configured for this deployment.");
          googleButton.disabled = false;
          return;
        }
        if (!window.google?.accounts?.id) {
          showGoogleMessage("Google sign-in is still loading. Please try again.");
          googleButton.disabled = false;
          return;
        }
        window.google.accounts.id.initialize({ client_id: googleClientId, callback: finishGoogleSignIn });
        window.google.accounts.id.prompt();
      }

      googleButton.addEventListener("click", () => {
        googleButton.disabled = true;
        initializeGoogleSignIn();
      });

      localStorage.removeItem("selectedPath");
      localStorage.removeItem("selectedPet");
      localStorage.removeItem("selectedGender");
      localStorage.removeItem("selectedAge");
    </script>
  </body>
</html>
