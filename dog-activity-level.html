<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Dog Activity Level</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page combined-questionnaire-page dog-details-page questionnaire-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand">
          <img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" />
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="available-pets.html" class="nav-item">Available Pets</a>
        </nav>
      </header>

      <main class="combined-questionnaire">
        <aside class="questionnaire-progress" aria-label="Questionnaire progress">
          <h1>Your perfect match starts here.</h1>
          <div class="progress-meter" data-question-count="4">
            <div class="progress-track" role="progressbar" aria-label="Questionnaire progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="progress-fill"></span>
            </div>
            <p class="progress-count" id="progress-count">0%</p>
          </div>
        </aside>

        <section class="questionnaire-panel">
          <h1>Tell Us About Your Ideal Dog</h1>

          <fieldset class="question-group">
            <legend>How active would you like your dog to be?</legend>
            <div class="question-options question-options-four">
              <button class="choice-option choice-option-primary" type="button" data-group="activity" data-choice="very-active">Very Active</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="activity" data-choice="moderately-active">Moderately Active</button>
              <button class="choice-option choice-option-primary" type="button" data-group="activity" data-choice="non-active">Not Active</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="activity" data-choice="no-preference">No Preference</button>
            </div>
          </fieldset>

          <fieldset class="question-group">
            <legend>Do you care whether or not your dog is house trained?</legend>
            <div class="question-options">
              <button class="choice-option choice-option-primary" type="button" data-group="house-training" data-choice="yes">Yes</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="house-training" data-choice="no">No</button>
            </div>
          </fieldset>

          <fieldset class="question-group">
            <legend>Do you care if your dog is disabled?</legend>
            <div class="question-options">
              <button class="choice-option choice-option-primary" type="button" data-group="disability" data-choice="not-disabled">Yes</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="disability" data-choice="any-disability">No</button>
            </div>
          </fieldset>

          <fieldset class="question-group">
            <legend>Would you prefer a protective dog?</legend>
            <div class="question-options">
              <button class="choice-option choice-option-primary" type="button" data-group="protective" data-choice="protective">Yes</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="protective" data-choice="not-protective">No</button>
            </div>
          </fieldset>

          <div class="dog-breed-actions">
            <a class="back-button" href="dog-breed.html">Back</a>
            <button class="questionnaire-next" id="dog-details-next" type="button" disabled>Next</button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const choiceButtons = document.querySelectorAll(".choice-option");
      const nextButton = document.querySelector("#dog-details-next");
      const progressCount = document.querySelector("#progress-count");
      const progressBar = document.querySelector(".progress-track");
      const progressFill = document.querySelector(".progress-fill");
      const storageKeys = {
        activity: "selectedDogActivity",
        "house-training": "selectedDogHouseTraining",
        disability: "selectedDogDisability",
        protective: "selectedDogProtective",
      };

      function refreshProgress() {
        const answeredCount = Object.values(storageKeys).filter((key) => localStorage.getItem(key)).length;
        const percentage = answeredCount * 25;
        progressCount.textContent = `${percentage}%`;
        progressBar.setAttribute("aria-valuenow", percentage);
        progressFill.style.height = `${percentage}%`;
        nextButton.disabled = answeredCount < 4;
      }

      choiceButtons.forEach((button) => {
        const storageKey = storageKeys[button.dataset.group];
        if (button.dataset.choice === localStorage.getItem(storageKey)) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          document.querySelectorAll(`[data-group="${button.dataset.group}"]`).forEach((option) => option.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem(storageKey, button.dataset.choice);
          refreshProgress();
        });
      });

      nextButton.addEventListener("click", () => {
        if (!nextButton.disabled) window.location.href = "dog-barking.html";
      });
      refreshProgress();
    </script>
    <script type="module" src="./src/questionnaire-back.js"></script>
  </body>
</html>
