<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Pet Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page pet-profile-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="match-results.html" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="pet-profile-layout" id="pet-profile">
        <aside class="pet-profile-sidebar">
          <div class="pet-profile-image-wrap">
            <img id="pet-image" class="pet-profile-image" alt="" />
            <span class="profile-match-score" id="pet-match"></span>
          </div>
          <a class="compatibility-button" id="compatibility-link" href="compatibility.html">See Your Compatibility</a>
          <div class="shelter-summary">
            <p id="pet-description"></p>
            <p><strong>Shelter:</strong> <span id="pet-shelter"></span></p>
            <p><strong>Phone Number:</strong> <span id="pet-phone"></span></p>
            <p><strong>Email:</strong> <span id="pet-email"></span></p>
            <p><strong>Location:</strong> <span id="pet-location"></span></p>
            <p><strong>Hours:</strong> <span id="pet-hours"></span></p>
          </div>
          <a class="profile-return" href="match-results.html">Return</a>
        </aside>

        <section class="pet-profile-facts">
          <h1 id="pet-name"></h1>
          <div class="pet-fact"><strong>Breed</strong><span id="pet-breed"></span></div>
          <div class="pet-fact"><strong>Age</strong><span id="pet-age"></span></div>
          <div class="pet-fact"><strong>Gender</strong><span id="pet-gender"></span></div>
          <div class="pet-fact"><strong>Size</strong><span id="pet-size"></span></div>
          <div class="pet-fact"><strong>Spayed/Neutered</strong><span id="pet-fixed"></span></div>
          <div class="pet-fact"><strong>House Trained</strong><span id="pet-trained"></span></div>
        </section>
      </main>
    </div>

    <script>
      const profiles = {
        milo: {
          name: "Milo", image: "src/assets/image copy 4.png", match: "98% Match", breed: "Border Collie Mix", age: "3 Years Old", gender: "Male", size: "Medium", fixed: "Yes", trained: "Yes", description: "Milo is an energetic, loyal companion who loves an active home.", shelter: "Paws & Paths Rescue", phone: "903-565-8899", email: "hello@pawsandpaths.org", location: "9854 County Road", hours: "10AM - 5PM"
        },
        luna: {
          name: "Luna", image: "src/assets/image copy 3.png", match: "95% Match", breed: "Domestic Shorthair", age: "2 Years Old", gender: "Female", size: "Small - 8lb", fixed: "Yes", trained: "Yes", description: "Luna is a gentle, curious cat who enjoys sunny windows and quiet company.", shelter: "SPCA", phone: "903-565-8899", email: "spca@shelter.org", location: "9854 County Road", hours: "10AM - 5PM"
        },
        bear: {
          name: "Bear", image: "src/assets/image copy 5.png", match: "91% Match", breed: "Corgi Mix", age: "5 Years Old", gender: "Male", size: "Medium", fixed: "Yes", trained: "Yes", description: "Bear is a friendly, steady dog ready to be part of a loving family.", shelter: "Second Chance Animal Care", phone: "903-565-8899", email: "adopt@secondchance.org", location: "9854 County Road", hours: "10AM - 5PM"
        },
        cleo: {
          name: "Cleo", image: "src/assets/image copy 2.png", match: "88% Match", breed: "Calico", age: "4 Years Old", gender: "Female", size: "Small - 9lb", fixed: "Yes", trained: "Yes", description: "Cleo is a calm, affectionate cat who would thrive in a patient home.", shelter: "Whiskers Welcome", phone: "903-565-8899", email: "hello@whiskerswelcome.org", location: "9854 County Road", hours: "10AM - 5PM"
        }
      };

      const profile = profiles[new URLSearchParams(window.location.search).get("pet")] || profiles.milo;
      document.title = `Pawmatch - ${profile.name}`;
      document.querySelector("#compatibility-link").href = `compatibility.html?pet=${new URLSearchParams(window.location.search).get("pet") || "milo"}`;
      document.querySelector("#pet-name").textContent = profile.name;
      document.querySelector("#pet-image").src = profile.image;
      document.querySelector("#pet-image").alt = `${profile.name}, ${profile.breed}`;
      document.querySelector("#pet-match").textContent = profile.match;
      ["breed", "age", "gender", "size", "fixed", "trained", "description", "shelter", "phone", "email", "location", "hours"].forEach((key) => {
        document.querySelector(`#pet-${key}`).textContent = profile[key];
      });
    </script>
  </body>
</html>
