<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Pet Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page pet-profile-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand">
          <img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" />
          <span class="brand-name">Pawmatch</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="profile.html" class="nav-item">Profile</a>
          <a href="adoption-choice.html" class="nav-item">Questionnaire</a>
          <a href="match-results.html" class="nav-item">Best Matches</a>
          <a href="available-pets.html" class="nav-item available-pets-top-button">Available Pets</a>
        </nav>
      </header>

      <main class="pet-profile-layout" id="pet-profile">
        <aside class="pet-profile-sidebar">
          <div class="pet-profile-image-wrap">
            <img id="pet-image" class="pet-profile-image" alt="" />
            <span class="profile-match-score" id="pet-match" hidden></span>
          </div>
          <a class="compatibility-button" id="compatibility-link" href="compatibility.html" hidden>See Your Compatibility</a>
          <div class="shelter-summary">
            <p id="pet-description"></p>
            <p><strong>Shelter:</strong> <span id="pet-shelter"></span></p>
            <p><strong>Phone Number:</strong> <span id="pet-phone"></span></p>
            <p><strong>Email:</strong> <span id="pet-email"></span></p>
            <p><strong>Location:</strong> <span id="pet-location"></span></p>
            <p><strong>Hours:</strong> <span id="pet-hours"></span></p>
          </div>
            <a class="profile-return" id="profile-return" href="match-results.html">Return</a>
        </aside>

        <section class="pet-profile-facts">
          <h1 id="pet-name"></h1>
          <div class="pet-fact"><strong>Breed</strong><span id="pet-breed"></span></div>
          <div class="pet-fact"><strong>Age</strong><span id="pet-age"></span></div>
          <div class="pet-fact"><strong>Gender</strong><span id="pet-gender"></span></div>
          <div class="pet-fact"><strong>Size</strong><span id="pet-size"></span></div>
          <div class="pet-fact"><strong>Spayed/Neutered</strong><span id="pet-fixed"></span></div>
          <div class="pet-fact"><strong>House Trained</strong><span id="pet-trained"></span></div>
          <div class="pet-fact"><strong>Available For</strong><span id="pet-path"></span></div>
        </section>
      </main>
    </div>

    <script type="module">
      import { getPet } from "./src/api.js";
      import { compatibilityProfiles, getCompatibility } from "./src/compatibility.js";
      import { isQuestionnaireComplete } from "./src/questionnaire-state.js";
      import imageCopy2 from "./src/assets/image copy 2.png";
      import imageCopy3 from "./src/assets/image copy 3.png";
      import imageCopy4 from "./src/assets/image copy 4.png";
      import imageCopy5 from "./src/assets/image copy 5.png";

      // The original demo pets keep their hand-written profiles and bundled photos.
      // Any other pet id (for example one added through the Google Form) is loaded from the API.
      const profiles = {
        milo: {
          name: "Milo", image: imageCopy4, path: "Adoption", breed: "Border Collie Mix", age: "3 Years Old", gender: "Male", size: "Medium", fixed: "Yes", trained: "Yes", description: "Milo is an energetic, loyal companion who loves an active home.", shelter: "Paws & Paths Rescue", phone: "903-565-8899", email: "hello@pawsandpaths.org", location: "9854 County Road", hours: "10AM - 5PM"
        },
        luna: {
          name: "Luna", image: imageCopy3, path: "Adoption", breed: "Domestic Shorthair", age: "2 Years Old", gender: "Female", size: "Small - 8lb", fixed: "Yes", trained: "Yes", description: "Luna is a gentle, curious cat who enjoys sunny windows and quiet company.", shelter: "SPCA", phone: "903-565-8899", email: "spca@shelter.org", location: "9854 County Road", hours: "10AM - 5PM"
        },
        bear: {
          name: "Bear", image: imageCopy5, path: "Foster", breed: "Corgi Mix", age: "5 Years Old", gender: "Male", size: "Medium", fixed: "Yes", trained: "Yes", description: "Bear is a friendly, steady dog ready to be part of a loving family.", shelter: "Second Chance Animal Care", phone: "903-565-8899", email: "adopt@secondchance.org", location: "9854 County Road", hours: "10AM - 5PM"
        },
        cleo: {
          name: "Cleo", image: imageCopy2, path: "Adoption", breed: "Calico", age: "4 Years Old", gender: "Female", size: "Small - 9lb", fixed: "Yes", trained: "Yes", description: "Cleo is a calm, affectionate cat who would thrive in a patient home.", shelter: "Whiskers Welcome", phone: "903-565-8899", email: "hello@whiskerswelcome.org", location: "9854 County Road", hours: "10AM - 5PM"
        },
        sayana: {
          name: "Sayana", image: imageCopy5, path: "Adoption", breed: "Pug", age: "2 Years Old", gender: "Female", size: "Small", fixed: "Yes", trained: "Yes", description: "Sayana is a playful, affectionate pug who loves attention and cozy naps.", shelter: "Paws & Paths Rescue", phone: "903-565-8899", email: "hello@pawsandpaths.org", location: "9854 County Road", hours: "10AM - 5PM"
        }
      };

      const yesNo = (value) => (value === true ? "Yes" : value === false ? "No" : "Unknown");
      const orNA = (value) => (value && String(value).trim()) || "N/A";

      // Turns a pet from the API into the same shape as the hand-written profiles above.
      function profileFromApi(pet) {
        const fallback = `${import.meta.env.BASE_URL}${pet.animal === "Cat" ? "cat.png" : "dog-transparent.png"}`;
        return {
          name: pet.name, image: pet.image || fallback, fallbackImage: fallback, path: pet.path, breed: pet.breed,
          age: Number(pet.age) > 0 ? `${pet.age} Year${Number(pet.age) === 1 ? "" : "s"} Old` : "Unknown",
          gender: pet.gender, size: orNA(pet.size === "Unknown" ? "" : pet.size), fixed: yesNo(pet.fixed), trained: yesNo(pet.trained),
          description: pet.description || "", shelter: orNA(pet.shelter?.name), phone: orNA(pet.shelter?.phone),
          email: orNA(pet.shelter?.email), location: orNA(pet.shelter?.location), hours: orNA(pet.shelter?.hours)
        };
      }

      async function loadProfile(petId) {
        if (!petId) return profiles.milo; // same as before when no pet is given
        if (profiles[petId]) return profiles[petId];
        try {
          return profileFromApi(await getPet(petId));
        } catch (error) {
          console.error(error);
          return null;
        }
      }

      async function main() {
        const profileParams = new URLSearchParams(window.location.search);
        const petId = profileParams.get("pet");
        const profileSource = profileParams.get("from");
        const profile = await loadProfile(petId);

        const returnPages = { available: "available-pets.html", notifications: "notifications.html", liked: "liked-pets.html", matches: "match-results.html" };
        if (returnPages[profileSource]) {
          document.querySelector("#profile-return").href = returnPages[profileSource];
        }
        const compatibilityLink = document.querySelector("#compatibility-link");
        const matchBadge = document.querySelector("#pet-match");

        if (!profile) {
          document.title = "Pawmatch - Pet not found";
          document.querySelector("#pet-name").textContent = "Pet not found";
          document.querySelector("#pet-description").textContent = "We couldn't find or load this pet. It may have been adopted, or the connection failed. Please go back and try again.";
          document.querySelector("#pet-image").remove();
          compatibilityLink.remove();
          matchBadge.remove();
          return;
        }

        document.title = `Pawmatch - ${profile.name}`;

        // Compatibility is only calculated for pets that have hand-written trait data.
        // For any other pet it would silently use Milo's data, so hide it instead.
        const compareId = petId || "milo";
        if (isQuestionnaireComplete() && compatibilityProfiles[compareId]) {
          compatibilityLink.href = `compatibility.html?pet=${compareId}${profileSource ? `&from=${profileSource}` : ""}`;
          compatibilityLink.hidden = false;
          matchBadge.textContent = `${getCompatibility(compareId).percent}% Match`;
          matchBadge.hidden = false;
        } else {
          compatibilityLink.remove();
          matchBadge.remove();
        }

        const image = document.querySelector("#pet-image");
        image.referrerPolicy = "no-referrer";
        if (profile.fallbackImage) {
          image.addEventListener("error", () => {
            if (image.getAttribute("src") !== profile.fallbackImage) image.src = profile.fallbackImage;
          });
        }
        image.src = profile.image;
        image.alt = `${profile.name}, ${profile.breed}`;

        document.querySelector("#pet-name").textContent = profile.name;
        document.querySelector("#pet-path").textContent = profile.path;
        ["breed", "age", "gender", "size", "fixed", "trained", "description", "shelter", "phone", "email", "location", "hours"].forEach((key) => {
          document.querySelector(`#pet-${key}`).textContent = profile[key];
        });
      }

      main();
    </script>
    <script type="module" src="./src/nav-feedback.js"></script>
  </body>
</html>
