<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Your Matches</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module">
      import { isQuestionnaireComplete } from "./src/questionnaire-state.js";

      if (!isQuestionnaireComplete()) {
        window.location.replace("home.html");
      } else {
        document.body.hidden = false;
      }
    </script>
  </head>
  <body class="choice-page match-results-page" hidden>
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand">
          <img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" />
          <span class="brand-name">Pawmatch</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="profile.html" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="available-pets.html" class="nav-item available-pets-top-button">Available Pets</a>
        </nav>
      </header>

      <main class="matches-content">
        <div class="matches-heading">
          <p class="matches-eyebrow">PAWMATCH RESULTS</p>
          <h1>Your Best Matches</h1>
          <p>Meet the Animals Who Are the Best Fits for You</p>
        </div>

        <section class="profile-grid" id="match-grid" aria-label="Animal matches"></section>
        <p class="matches-empty" id="matches-empty" role="status">Finding your matches…</p>
      </main>
    </div>
    <script type="module">
      import { getPets } from "./src/api.js";
      import { getCompatibility } from "./src/compatibility.js";
      import { esc, fallbackImage, imagesFor, useFallbackImages, withSlowNotice } from "./src/pet-data.js";

      const grid = document.querySelector("#match-grid");
      const status = document.querySelector("#matches-empty");
      const selectedPet = localStorage.getItem("selectedPet");
      const ageGroup = (age) => (!(Number(age) > 0) ? "Unknown" : age < 1 ? "Baby" : age < 3 ? "Young" : age <= 7 ? "Adult" : "Senior");
      useFallbackImages(grid);

      // A pet is a match when it's the species the person chose and it doesn't
      // conflict with any of their top 3 ranked answers. Unknown traits don't count against it.
      function isMatch(pet, compatibility) {
        if (selectedPet && pet.animal?.toLowerCase() !== selectedPet) return false;
        return compatibility.rows
          .filter((row) => row.ranked)
          .slice(0, 3)
          .every((row) => !row.characteristic || row.matched);
      }

      function cardHtml({ pet, compatibility }) {
        return `
          <article class="profile-card" data-profile="${esc(pet.id)}" tabindex="0">
            <div class="profile-image-wrap">
              <img src="${esc(imagesFor(pet)[0])}" alt="${esc(pet.name)}, ${esc(pet.breed)}" class="profile-image" data-fallback="${esc(fallbackImage(pet))}" loading="lazy" referrerpolicy="no-referrer" />
              <span class="match-score">${compatibility.percent}% Match</span>
            </div>
            <div class="profile-details">
              <h2>${esc(pet.name)}</h2>
              <p class="profile-type">${esc(pet.breed)}</p>
              <dl class="profile-facts">
                <div><dt>Gender</dt><dd>${esc(pet.gender)}</dd></div>
                <div><dt>Age</dt><dd>${ageGroup(Number(pet.age))}</dd></div>
              </dl>
            </div>
          </article>`;
      }

      const openProfile = (card) => {
        window.location.href = `pet-profile.html?pet=${encodeURIComponent(card.dataset.profile)}&from=matches`;
      };
      grid.addEventListener("click", (event) => {
        const card = event.target.closest(".profile-card");
        if (card) openProfile(card);
      });
      grid.addEventListener("keydown", (event) => {
        const card = event.target.closest(".profile-card");
        if (card && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          openProfile(card);
        }
      });

      async function init() {
        try {
          const pets = await withSlowNotice(status, getPets());
          const matches = pets
            .map((pet) => ({ pet, compatibility: getCompatibility(pet) }))
            .filter(({ pet, compatibility }) => isMatch(pet, compatibility))
            .sort((first, second) => second.compatibility.percent - first.compatibility.percent);
          if (!matches.length) {
            status.textContent = "No Pets Matched Your Top-Ranked Preferences";
            return;
          }
          grid.innerHTML = matches.map(cardHtml).join("");
          status.hidden = true;
        } catch (error) {
          console.error(error);
          status.textContent = "We couldn't load your matches. Please refresh the page to try again.";
        }
      }

      init();
    </script>
    <script type="module" src="./src/nav-feedback.js"></script>
  </body>
</html>
