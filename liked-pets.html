<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Liked Pets</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page match-results-page liked-pets-settings-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand"><img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" /><span class="brand-name">Pawmatch</span></a>
        <nav class="nav-links" aria-label="Primary navigation"><a href="adoption-choice.html" class="nav-item">Questionnaire</a><a href="match-results.html" class="nav-item">Best Matches</a><a href="available-pets.html" class="nav-item">Available Pets</a></nav>
      </header>
      <main class="profile-settings-layout liked-pets-settings-layout">
        <aside class="profile-settings-sidebar" aria-label="Profile settings navigation">
          <a class="profile-settings-nav" href="profile.html">Profile</a>
          <a class="profile-settings-nav" href="notifications.html">Notifications</a>
          <a class="profile-settings-nav" href="password.html">Password</a>
          <a class="profile-settings-nav is-active" id="liked-pets-tab" href="liked-pets.html" aria-current="page">Saved Pets</a>
          <button class="profile-settings-nav logout-button" id="logout-button" type="button">Log Out</button>
        </aside>
        <section class="profile-settings-content">
          <section class="matches-content">
            <div class="matches-heading"><p class="matches-eyebrow">PAWMATCH</p><h1>Liked Pets</h1><p>Pets you saved for a closer look.</p></div>
            <section class="profile-grid" id="liked-pet-grid" aria-label="Liked pets"></section>
          </section>
        </section>
      </main>
    </div>
    <script type="module">
      import { getPets } from "./src/api.js";
      import { esc, ageText, fallbackImage, imagesFor, readLikedPets, useFallbackImages, withSlowNotice } from "./src/pet-data.js";

      const grid = document.querySelector("#liked-pet-grid");
      const showMessage = (text) => { grid.innerHTML = `<p class="ranking-empty" role="status">${esc(text)}</p>`; };
      useFallbackImages(grid);

      function cardHtml(pet) {
        return `
          <a class="profile-card" href="pet-profile.html?pet=${encodeURIComponent(pet.id)}&amp;from=liked">
            <div class="profile-image-wrap"><img src="${esc(imagesFor(pet)[0])}" alt="${esc(pet.name)}, ${esc(pet.breed)}" class="profile-image" data-fallback="${esc(fallbackImage(pet))}" loading="lazy" referrerpolicy="no-referrer" /></div>
            <div class="profile-details">
              <h2>${esc(pet.name)}</h2>
              <p class="profile-type">${esc(pet.breed)}</p>
              <dl class="profile-facts"><div><dt>Gender</dt><dd>${esc(pet.gender)}</dd></div><div><dt>Age</dt><dd>${esc(ageText(pet.age))}</dd></div></dl>
            </div>
          </a>`;
      }

      async function init() {
        const likedIds = readLikedPets();
        if (!likedIds.length) return showMessage("You have not liked any pets yet.");
        showMessage("Loading your liked pets…");
        try {
          const pets = await withSlowNotice(grid.querySelector("p"), getPets());
          // Keep the order the pets were liked in; skip pets that are no longer listed.
          const byId = new Map(pets.map((pet) => [pet.id, pet]));
          const liked = likedIds.map((id) => byId.get(id)).filter(Boolean);
          if (!liked.length) return showMessage("The pets you liked are no longer listed.");
          grid.innerHTML = liked.map(cardHtml).join("");
        } catch (error) {
          console.error(error);
          showMessage("We couldn't load your liked pets. Please refresh the page to try again.");
        }
      }

      init();
    </script>
    <script type="module" src="./src/nav-feedback.js"></script>
  </body>
</html>
