<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Dog Personality</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page dog-hypoallergenic-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>Would You Prefer a Social or Reserved Dog?</h1>

        <div class="choice-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="social">Social Dog</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="reserved">Reserved Dog</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="no-preference">No Preference</button>
        </div>

        <a class="back-button" href="dog-disability.html">Back</a>
      </main>
    </div>

    <script>
      const personalityButtons = document.querySelectorAll(".choice-option");
      const savedPersonality = localStorage.getItem("selectedDogPersonality");

      personalityButtons.forEach((button) => {
        if (button.dataset.choice === savedPersonality) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          personalityButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedDogPersonality", button.dataset.choice);
        });
      });
    </script>
  </body>
</html>
