<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Pet Gender</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page gender-choice-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>What Gender of Pet Are You Looking For?</h1>

        <div class="choice-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="male">
            <span class="choice-circle" aria-hidden="true"></span>
            <span class="choice-label">Male</span>
          </button>

          <button class="choice-option choice-option-secondary" type="button" data-choice="female">
            <span class="choice-circle" aria-hidden="true"></span>
            <span class="choice-label">Female</span>
          </button>

          <button class="choice-option choice-option-secondary" type="button" data-choice="any">
            <span class="choice-circle" aria-hidden="true"></span>
            <span class="choice-label">No Preference</span>
          </button>
        </div>

        <a class="back-button" href="pet-choice.html">Back</a>
      </main>
    </div>

    <script>
      const genderButtons = document.querySelectorAll(".choice-option");
      const savedGender = localStorage.getItem("selectedGender");

      genderButtons.forEach((button) => {
        if (button.dataset.choice === savedGender) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          genderButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedGender", button.dataset.choice);
          window.location.href = "pet-age.html";
        });
      });
    </script>
  </body>
</html>
