<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Compatibility</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module">
      import { isQuestionnaireComplete } from "./src/questionnaire-state.js";

      if (!isQuestionnaireComplete()) {
        window.location.replace("adoption-choice.html");
      } else {
        document.body.hidden = false;
      }
    </script>
  </head>
  <body class="choice-page compatibility-page" hidden>
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand">
          <img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" />
          <span class="brand-name">Pawmatch</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="profile.html" class="nav-item">Profile</a>
          <a href="match-results.html" class="nav-item">Best Matches</a>
          <a href="available-pets.html" class="nav-item">Available Pets</a>
        </nav>
      </header>

      <main class="compatibility-layout" id="compatibility-profile">
        <section class="compatibility-facts">
          <h2 id="compatibility-name"></h2>
          <p class="compatibility-total" id="compatibility-total"></p>
          <p class="compatibility-percent" id="compatibility-percent"></p>
          <div class="comparison-header"><span>Your Answer</span><span>Rating</span><span>Pet Characteristic</span></div>
          <div class="comparison-list" id="comparison-list"></div>
        </section>
        <a class="profile-return compatibility-return" id="compatibility-return" href="pet-profile.html">Back</a>
      </main>
    </div>

    <script type="module">
      import { getCompatibility } from "./src/compatibility.js";

      const from = new URLSearchParams(window.location.search).get("from");
      const { petId, profile, rows, earnedPoints, totalPoints, percent } = getCompatibility(new URLSearchParams(window.location.search).get("pet"));
      document.title = `Pawmatch - ${profile.name} Compatibility`;
      document.querySelector("#compatibility-name").textContent = profile.name;
      document.querySelector("#compatibility-return").href = `pet-profile.html?pet=${petId}${from ? `&from=${from}` : ""}`;
      document.querySelector("#compatibility-total").textContent = `Total Compatibility: ${earnedPoints}/${totalPoints}`;
      document.querySelector("#compatibility-percent").textContent = `${percent}% Match`;

      const comparisonList = document.querySelector("#comparison-list");
      rows.filter((rowData) => !rowData.hidden).forEach((rowData) => {
        const row = document.createElement("div");
        row.className = "comparison-row";
        row.innerHTML = `<span>${rowData.answer}</span><span>${rowData.earned}/${rowData.points}</span><span>${rowData.characteristic || "Not provided"}</span>`;
        comparisonList.append(row);
      });
    </script>
    <script type="module" src="./src/nav-feedback.js"></script>
  </body>
</html>
