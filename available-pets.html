<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Available Pets</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page available-pets-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand"><img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" /><span class="brand-name">Pawmatch</span></a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="profile.html" class="nav-item">Profile</a>
          <a href="match-results.html" class="nav-item">Best Matches</a>
          <a href="adoption-choice.html" class="nav-item">Questionnaire</a>
        </nav>
      </header>

      <main class="available-pets-content">
        <section class="pet-search-bar" aria-label="Search and filter available pets">
          <label class="pet-search-field">
            <span aria-hidden="true">⌕</span>
            <input id="pet-search" type="search" placeholder="Search by name" />
          </label>
          <select data-filter="path" aria-label="Adoption or foster"><option value="">Adoption or Foster</option><option>Adoption</option><option>Foster</option></select>
          <select data-filter="animal" aria-label="Cat or dog"><option value="">Cat or Dog</option><option>Cat</option><option>Dog</option></select>
          <select data-filter="breed" aria-label="Breed"><option value="">Breed</option><option>Scottish-Fold</option><option>British Shorthair</option><option>Pug</option><option>Labrador Retriever</option></select>
          <select data-filter="center" aria-label="Adoption center"><option value="">Adoption Center</option><option>SPCA</option><option>Paws & Paths Rescue</option><option>Second Chance Animal Care</option></select>
          <select data-filter="gender" aria-label="Gender"><option value="">Gender</option><option>Female</option><option>Male</option></select>
          <button id="liked-filter" class="liked-filter" type="button" aria-pressed="false">Liked</button>
        </section>

        <section class="available-pet-grid" id="available-pet-grid" aria-label="Available pets">
          <article class="available-pet-card" data-profile="luna" data-path="Adoption" data-name="Kylar" data-animal="Cat" data-breed="British Shorthair" data-gender="Male" data-liked="false">
            <button class="pet-like" type="button" aria-label="Like Kylar" aria-pressed="false">♡</button>
            <img src="src/assets/image copy 3.png" alt="Kylar, a British Shorthair cat" />
            <div class="available-pet-meta"><strong>Kylar</strong><span>Male</span><span>Years Old</span><span>British Shorthair</span></div>
          </article>
          <article class="available-pet-card" data-profile="sayana" data-path="Adoption" data-name="Sayana" data-animal="Dog" data-breed="Pug" data-gender="Female" data-liked="false">
            <button class="pet-like" type="button" aria-label="Like Sayana" aria-pressed="false">♡</button>
            <img src="src/assets/image copy 5.png" alt="Sayana, a pug" />
            <div class="available-pet-meta"><strong>Sayana</strong><span>Female</span><span>2 Years Old</span><span>Pug</span></div>
          </article>
          <article class="available-pet-card" data-profile="bear" data-path="Foster" data-name="Jarl" data-animal="Dog" data-breed="Labrador Retriever" data-gender="Male" data-liked="false">
            <button class="pet-like" type="button" aria-label="Like Jarl" aria-pressed="false">♡</button>
            <img src="src/assets/image copy 4.png" alt="Jarl, a Labrador Retriever" />
            <div class="available-pet-meta"><strong>Jarl</strong><span>Male</span><span>1 Year Old</span><span>Labrador Retriever</span></div>
          </article>
        </section>
        <a class="profile-return available-return" id="available-pets-return" href="home.html">Return</a>
      </main>
    </div>

    <script>
      const cards = [...document.querySelectorAll(".available-pet-card")];
      const savedLikedPets = JSON.parse(localStorage.getItem("pawmatchLikedPets") || "[]");
      const search = document.querySelector("#pet-search");
      const likedFilter = document.querySelector("#liked-filter");
      const filters = [...document.querySelectorAll("[data-filter]")];
      const searchField = search.closest(".pet-search-field");

      function refreshActiveFilterStyles() {
        filters.forEach((filter) => {
          filter.classList.toggle("is-filter-active", Boolean(filter.value));
        });
        searchField.classList.toggle("is-filter-active", Boolean(search.value.trim()));
        likedFilter.classList.toggle("is-filter-active", likedFilter.getAttribute("aria-pressed") === "true");
      }

      function applyFilters() {
        const query = search.value.trim().toLowerCase();
        const likedOnly = likedFilter.getAttribute("aria-pressed") === "true";
        refreshActiveFilterStyles();
        cards.forEach((card) => {
          const matchesSearch = !query || card.dataset.name.toLowerCase().includes(query);
          const matchesFilters = filters.every((filter) => !filter.value || card.dataset[filter.dataset.filter] === filter.value);
          const matchesLiked = !likedOnly || card.dataset.liked === "true";
          card.hidden = !(matchesSearch && matchesFilters && matchesLiked);
        });
      }

      search.addEventListener("input", applyFilters);
      filters.forEach((filter) => filter.addEventListener("change", applyFilters));
      likedFilter.addEventListener("click", () => {
        const isLiked = likedFilter.getAttribute("aria-pressed") !== "true";
        likedFilter.setAttribute("aria-pressed", String(isLiked));
        applyFilters();
      });
      document.querySelectorAll(".pet-like").forEach((button) => {
        const card = button.closest(".available-pet-card");
        const profileId = card.dataset.profile;
        const isSaved = savedLikedPets.includes(profileId);
        button.setAttribute("aria-pressed", String(isSaved));
        button.textContent = isSaved ? "♥" : "♡";
        card.dataset.liked = String(isSaved);
        button.addEventListener("click", () => {
          const card = button.closest(".available-pet-card");
          const liked = button.getAttribute("aria-pressed") !== "true";
          button.setAttribute("aria-pressed", String(liked));
          button.textContent = liked ? "♥" : "♡";
          card.dataset.liked = String(liked);
          const likedPets = JSON.parse(localStorage.getItem("pawmatchLikedPets") || "[]");
          const index = likedPets.indexOf(card.dataset.profile);
          if (liked && index === -1) likedPets.push(card.dataset.profile);
          if (!liked && index !== -1) likedPets.splice(index, 1);
          localStorage.setItem("pawmatchLikedPets", JSON.stringify(likedPets));
          applyFilters();
        });
      });
      cards.forEach((card) => {
        card.addEventListener("click", (event) => {
          if (event.target.closest(".pet-like")) return;
          window.location.href = `pet-profile.html?pet=${card.dataset.profile}&from=available`;
        });
      });

      document.querySelector("#available-pets-return").addEventListener("click", (event) => {
        try {
          const previousPage = new URL(document.referrer);
          if (previousPage.origin !== window.location.origin || previousPage.href === window.location.href) return;
          event.preventDefault();
          window.history.back();
        } catch {
          // The Home link remains the fallback when there is no usable referrer.
        }
      });

      applyFilters();
    </script>
    <script type="module" src="./src/nav-feedback.js"></script>
  </body>
</html>
