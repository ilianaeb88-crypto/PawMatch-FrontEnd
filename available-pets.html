<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Available Pets</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page available-pets-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand"><img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" /><span class="brand-name">Pawmatch</span></a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="profile.html" class="nav-item">Profile</a>
          <a href="match-results.html" class="nav-item">Best Matches</a>
          <a href="adoption-choice.html" class="nav-item">Questionnaire</a>
        </nav>
      </header>

      <main class="available-pets-content">
        <section class="pet-search-bar" aria-label="Search and filter available pets">
          <label class="pet-search-field">
            <span aria-hidden="true">⌕</span>
            <input id="pet-search" type="search" placeholder="Search by name" />
          </label>
          <select data-filter="path" aria-label="Adoption or foster"><option value="">Adoption or Foster</option><option>Adoption</option><option>Foster</option></select>
          <select data-filter="animal" aria-label="Cat or dog"><option value="">Cat or Dog</option><option>Cat</option><option>Dog</option></select>
          <!-- Breed and Adoption Center options are filled in from the pets that actually exist -->
          <select data-filter="breed" aria-label="Breed"><option value="">Breed</option></select>
          <select data-filter="center" aria-label="Adoption center"><option value="">Adoption Center</option></select>
          <select data-filter="gender" aria-label="Gender"><option value="">Gender</option><option>Female</option><option>Male</option></select>
          <button id="liked-filter" class="liked-filter" type="button" aria-pressed="false">Liked</button>
        </section>

        <p id="pet-status" role="status" aria-live="polite">Loading pets…</p>
        <section class="available-pet-grid" id="available-pet-grid" aria-label="Available pets"></section>
        <a class="profile-return available-return" id="available-pets-return" href="home.html">Return</a>
      </main>
    </div>

    <script type="module">
      import { getPets } from "./src/api.js";
      import imageCopy2 from "./src/assets/image copy 2.png";
      import imageCopy3 from "./src/assets/image copy 3.png";
      import imageCopy4 from "./src/assets/image copy 4.png";
      import imageCopy5 from "./src/assets/image copy 5.png";

      // The original demo pets keep their bundled photos. Every other pet uses
      // the image URL saved with it (for form pets, a Google Drive link).
      const demoImages = { milo: imageCopy4, luna: imageCopy3, bear: imageCopy5, cleo: imageCopy2 };
      const fallbackImage = (pet) => `${import.meta.env.BASE_URL}${pet.animal === "Cat" ? "cat.png" : "dog-transparent.png"}`;
      const imageFor = (pet) => demoImages[pet.id] || pet.image || fallbackImage(pet);

      // Pet details come from a public form, so always escape before putting them in HTML.
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const ageText = (age) => (Number(age) > 0 ? `${age} Year${Number(age) === 1 ? "" : "s"} Old` : "Age unknown");

      const grid = document.querySelector("#available-pet-grid");
      const status = document.querySelector("#pet-status");
      const search = document.querySelector("#pet-search");
      const likedFilter = document.querySelector("#liked-filter");
      const filters = [...document.querySelectorAll("[data-filter]")];
      const searchField = search.closest(".pet-search-field");
      let cards = [];

      function readLikedPets() {
        try {
          return JSON.parse(localStorage.getItem("pawmatchLikedPets") || "[]");
        } catch {
          return [];
        }
      }

      function cardHtml(pet) {
        return `
          <article class="available-pet-card" data-profile="${esc(pet.id)}" data-path="${esc(pet.path)}" data-name="${esc(pet.name)}" data-animal="${esc(pet.animal)}" data-breed="${esc(pet.breed)}" data-gender="${esc(pet.gender)}" data-center="${esc(pet.shelter?.name)}" data-liked="false">
            <button class="pet-like" type="button" aria-label="Like ${esc(pet.name)}" aria-pressed="false">♡</button>
            <img src="${esc(imageFor(pet))}" alt="${esc(pet.name)}, ${esc(pet.breed)}" data-fallback="${esc(fallbackImage(pet))}" loading="lazy" referrerpolicy="no-referrer" />
            <div class="available-pet-meta"><strong>${esc(pet.name)}</strong><span>${esc(pet.gender)}</span><span>${esc(ageText(pet.age))}</span><span>${esc(pet.breed)}</span></div>
          </article>`;
      }

      function setLiked(card, liked) {
        const button = card.querySelector(".pet-like");
        button.setAttribute("aria-pressed", String(liked));
        button.textContent = liked ? "♥" : "♡";
        card.dataset.liked = String(liked);
      }

      function fillOptions(select, values) {
        const placeholder = select.options[0];
        select.replaceChildren(placeholder);
        [...new Set(values.map((value) => String(value ?? "").trim()).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b))
          .forEach((value) => select.append(new Option(value, value)));
      }

      function refreshActiveFilterStyles() {
        filters.forEach((filter) => {
          filter.classList.toggle("is-filter-active", Boolean(filter.value));
        });
        searchField.classList.toggle("is-filter-active", Boolean(search.value.trim()));
        likedFilter.classList.toggle("is-filter-active", likedFilter.getAttribute("aria-pressed") === "true");
      }

      function applyFilters() {
        const query = search.value.trim().toLowerCase();
        const likedOnly = likedFilter.getAttribute("aria-pressed") === "true";
        refreshActiveFilterStyles();
        cards.forEach((card) => {
          const matchesSearch = !query || card.dataset.name.toLowerCase().includes(query);
          const matchesFilters = filters.every((filter) => !filter.value || card.dataset[filter.dataset.filter] === filter.value);
          const matchesLiked = !likedOnly || card.dataset.liked === "true";
          card.hidden = !(matchesSearch && matchesFilters && matchesLiked);
        });
      }

      search.addEventListener("input", applyFilters);
      filters.forEach((filter) => filter.addEventListener("change", applyFilters));
      likedFilter.addEventListener("click", () => {
        const isLiked = likedFilter.getAttribute("aria-pressed") !== "true";
        likedFilter.setAttribute("aria-pressed", String(isLiked));
        applyFilters();
      });

      // One listener on the grid handles every card, including ones added later.
      grid.addEventListener("click", (event) => {
        const card = event.target.closest(".available-pet-card");
        if (!card) return;
        if (event.target.closest(".pet-like")) {
          const liked = card.dataset.liked !== "true";
          setLiked(card, liked);
          const likedPets = readLikedPets();
          const index = likedPets.indexOf(card.dataset.profile);
          if (liked && index === -1) likedPets.push(card.dataset.profile);
          if (!liked && index !== -1) likedPets.splice(index, 1);
          localStorage.setItem("pawmatchLikedPets", JSON.stringify(likedPets));
          applyFilters();
          return;
        }
        window.location.href = `pet-profile.html?pet=${encodeURIComponent(card.dataset.profile)}&from=available`;
      });

      // If a photo can't load (private Drive file, old path), show a generic one instead.
      grid.addEventListener("error", (event) => {
        const image = event.target;
        if (!(image instanceof HTMLImageElement)) return;
        const fallback = image.dataset.fallback;
        if (fallback && image.getAttribute("src") !== fallback) image.src = fallback;
      }, true);

      document.querySelector("#available-pets-return").addEventListener("click", (event) => {
        try {
          const previousPage = new URL(document.referrer);
          if (previousPage.origin !== window.location.origin || previousPage.href === window.location.href) return;
          event.preventDefault();
          window.history.back();
        } catch {
          // The Home link remains the fallback when there is no usable referrer.
        }
      });

      async function init() {
        // The free hosting plan sleeps when idle, so the first load can be slow.
        const slowNotice = setTimeout(() => {
          status.textContent = "Still loading… the server may be waking up, which can take up to a minute.";
        }, 6000);
        try {
          const pets = await getPets();
          clearTimeout(slowNotice);
          if (!pets.length) {
            status.textContent = "No pets are available right now. Please check back soon.";
            return;
          }
          fillOptions(document.querySelector('[data-filter="breed"]'), pets.map((pet) => pet.breed));
          fillOptions(document.querySelector('[data-filter="center"]'), pets.map((pet) => pet.shelter?.name));
          grid.innerHTML = pets.map(cardHtml).join("");
          cards = [...grid.querySelectorAll(".available-pet-card")];
          const likedPets = readLikedPets();
          cards.forEach((card) => setLiked(card, likedPets.includes(card.dataset.profile)));
          status.hidden = true;
          applyFilters();
        } catch (error) {
          clearTimeout(slowNotice);
          console.error(error);
          status.textContent = "We couldn't load the pets. Please refresh the page to try again.";
        }
      }

      init();
    </script>
    <script type="module" src="./src/nav-feedback.js"></script>
  </body>
</html>
