<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Newly Added Pets</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page match-results-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand"><span class="brand-icon" aria-hidden="true">🐾</span><span class="brand-name">Pawmatch</span></a>
        <nav class="nav-links" aria-label="Primary navigation"><a href="profile.html" class="nav-item">Profile</a><a href="available-pets.html" class="nav-item">Available Pets</a></nav>
      </header>
      <main class="matches-content">
        <div class="matches-heading"><p class="matches-eyebrow">PAWMATCH NOTIFICATIONS</p><h1>Newly Added Pets</h1><p>Meet the newest pets waiting for a home.</p></div>
        <section class="profile-grid" aria-label="Newly added pets">
          <article class="profile-card"><div class="profile-image-wrap"><img src="src/assets/image copy 2.png" class="profile-image" alt="Cleo, a newly added cat" /></div><div class="profile-details"><h2>Cleo</h2><p class="profile-type">Calico</p><dl class="profile-facts"><div><dt>Gender</dt><dd>Female</dd></div><div><dt>Age</dt><dd>4 years</dd></div></dl></div></article>
          <article class="profile-card"><div class="profile-image-wrap"><img src="src/assets/image copy 5.png" class="profile-image" alt="Bear, a newly added dog" /></div><div class="profile-details"><h2>Bear</h2><p class="profile-type">Corgi Mix</p><dl class="profile-facts"><div><dt>Gender</dt><dd>Male</dd></div><div><dt>Age</dt><dd>5 years</dd></div></dl></div></article>
          <article class="profile-card"><div class="profile-image-wrap"><img src="src/assets/image copy 3.png" class="profile-image" alt="Luna, a newly added cat" /></div><div class="profile-details"><h2>Luna</h2><p class="profile-type">Domestic Shorthair</p><dl class="profile-facts"><div><dt>Gender</dt><dd>Female</dd></div><div><dt>Age</dt><dd>2 years</dd></div></dl></div></article>
        </section>
      </main>
    </div>
