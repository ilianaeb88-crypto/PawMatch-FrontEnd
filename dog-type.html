<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Dog Group</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page dog-type-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>What Group do You Want Your Dog to Belong To?</h1>

        <div class="choice-options weight-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="sporting">Sporting</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="hound">Hound</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="terrier">Terrier</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="working">Working</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="herding">Herding</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="toy">Toy</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="hunting">Hunting</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="no-preference">No Preference</button>
        </div>

        <a class="back-button" href="dog-disability.html">Back</a>
      </main>
    </div>

    <script>
      const typeButtons = document.querySelectorAll(".choice-option");
      const savedType = localStorage.getItem("selectedDogType");

      typeButtons.forEach((button) => {
        if (button.dataset.choice === savedType) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          typeButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedDogType", button.dataset.choice);
          window.location.href = "dog-protective.html";
        });
      });
    </script>
  </body>
</html>
