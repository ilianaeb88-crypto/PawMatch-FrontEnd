<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="account-page">
    <div class="account-page-shell">
      <header class="topbar account-page-topbar">
      </header>

      <main class="account-form-card">
        <p class="account-eyebrow">PAWMATCH</p>
        <h1>Sign In</h1>
        <p class="account-intro">Sign in to access your saved questionnaire answers and favorite pets.</p>

        <form class="account-form" id="sign-in-form" action="home.html">
          <label for="sign-in-email">Email</label>
          <input id="sign-in-email" name="email" type="email" autocomplete="email" required />

          <label for="sign-in-password">Password</label>
          <input id="sign-in-password" name="password" type="password" autocomplete="current-password" required />
          <a class="forgot-password-link" href="#">Forgot your password?</a>

          <button type="submit">Sign In</button>
          <a class="account-back-link" href="index.html">Back to Home</a>
        </form>
        <p class="account-form-message" id="sign-in-message" role="alert" aria-live="polite"></p>
      </main>
    </div>

    <div class="reset-overlay" id="reset-overlay" hidden>
      <div class="reset-modal" role="dialog" aria-modal="true" aria-labelledby="reset-heading">
        <button class="reset-close" id="reset-close" type="button" aria-label="Close">&times;</button>
        <h2 id="reset-heading">Please Enter Your Email and if We Have it in Our System Then We Will Email You With a Code to Reset Your Password</h2>
        <label for="reset-email">Email</label>
        <input id="reset-email" type="email" autocomplete="email" />
        <label for="reset-code">Code</label>
        <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" />
      </div>
    </div>

    <script type="module">
      import { restoreAnswersForAccount } from "./src/questionnaire-answers.js";

      const resetOverlay = document.querySelector("#reset-overlay");
      const closeReset = () => { resetOverlay.hidden = true; };
      document.querySelector(".forgot-password-link").addEventListener("click", (event) => {
        event.preventDefault();
        resetOverlay.hidden = false;
        document.querySelector("#reset-email").focus();
      });
      document.querySelector("#reset-close").addEventListener("click", closeReset);
      resetOverlay.addEventListener("click", (event) => { if (event.target === resetOverlay) closeReset(); });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeReset(); });

      const signInForm = document.querySelector("#sign-in-form");
      const signInMessage = document.querySelector("#sign-in-message");

      signInForm.addEventListener("submit", (event) => {
        const account = JSON.parse(localStorage.getItem("pawmatchAccount") || "null");
        const email = document.querySelector("#sign-in-email").value.trim().toLowerCase();
        const password = document.querySelector("#sign-in-password").value;

        if (!account || account.email !== email || account.password !== password) {
          event.preventDefault();
          signInMessage.textContent = "The email or password does not match our records.";
          return;
        }

        event.preventDefault();
        restoreAnswersForAccount(email);
        sessionStorage.setItem("pawmatchJustLoggedIn", "true");
        window.location.href = "home.html";
      });
    </script>
  </body>
</html>
