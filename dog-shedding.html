<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Shedding Preference</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page dog-shedding-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>Do You Care About Shedding?</h1>

        <div class="choice-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="does-not-shed">I Want A Dog That Doesn't Shed</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="shedding-does-not-matter">I Don't Care About How Much My Dog Sheds</button>
        </div>

        <a class="back-button" href="dog-barking.html">Back</a>
      </main>
    </div>

    <script>
      const sheddingButtons = document.querySelectorAll(".choice-option");
      const savedShedding = localStorage.getItem("selectedDogShedding");

      sheddingButtons.forEach((button) => {
        if (button.dataset.choice === savedShedding) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          sheddingButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedDogShedding", button.dataset.choice);
          window.location.href = "children.html";
        });
      });
    </script>
  </body>
</html>
