<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Pet Age</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>How Old do You Want Your Pet to Be?</h1>

        <div class="choice-options age-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="less-than-6-months">0-1 (Baby)</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="1-3">1-3 (Young)</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="3-7">3-7 (Adult)</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="greater-than-7">Greater than 7 (Senior)</button>
        </div>

        <a class="back-button" href="cat-gender.html">Back</a>
      </main>
    </div>

    <script>
      const ageButtons = document.querySelectorAll(".choice-option");
      const savedAge = localStorage.getItem("selectedAge");

      ageButtons.forEach((button) => {
        if (button.dataset.choice === savedAge) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          ageButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedAge", button.dataset.choice);
          window.location.href = "cat-weight.html";
        });
      });
    </script>
  </body>
</html>
