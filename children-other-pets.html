<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Household Questions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page combined-questionnaire-page questionnaire-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand">
          <img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" />
          <span class="brand-name">Pawmatch</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="available-pets.html" class="nav-item">Available Pets</a>
        </nav>
      </header>

      <main class="combined-questionnaire">
        <aside class="questionnaire-progress" aria-label="Questionnaire progress">
          <h1>Your perfect match starts here.</h1>
          <div class="progress-meter" data-question-count="3">
            <div class="progress-track" role="progressbar" aria-label="Questionnaire progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="progress-fill"></span>
            </div>
            <p class="progress-count" id="progress-count">0%</p>
          </div>
        </aside>

        <section class="questionnaire-panel">
          <h1>Tell Us About Your Home</h1>

          <fieldset class="question-group">
            <legend>Do you have any children 12 or under?</legend>
            <div class="question-options">
              <button class="choice-option choice-option-primary" type="button" data-group="children" data-choice="yes">Yes</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="children" data-choice="no">No</button>
            </div>
          </fieldset>

          <fieldset class="question-group">
            <legend>Do you have a cat and/or dog?</legend>
            <div class="question-options question-options-four">
              <button class="choice-option choice-option-primary" type="button" data-group="other-pets" data-choice="cat">Cat</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="other-pets" data-choice="dog">Dog</button>
              <button class="choice-option choice-option-primary" type="button" data-group="other-pets" data-choice="dog-and-cat">Dog and Cat</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="other-pets" data-choice="neither">Neither</button>
            </div>
          </fieldset>
          <fieldset class="question-group">
            <legend>Do You Have a Yard Around 500sqft or Greater and/or Will You Take Your Dog for Daily Walks?</legend>
            <div class="question-options question-options-five">
              <button class="choice-option choice-option-primary" type="button" data-group="yard-walks" data-choice="500-or-greater">500sqft or Greater</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="yard-walks" data-choice="less-than-500">Less than 500sqft</button>
              <button class="choice-option choice-option-primary" type="button" data-group="yard-walks" data-choice="daily-walks">Daily Walks</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="yard-walks" data-choice="weekly-walks">Weekly Walks</button>
              <button class="choice-option choice-option-primary" type="button" data-group="yard-walks" data-choice="both">Both</button>
              <button class="choice-option choice-option-secondary" type="button" data-group="yard-walks" data-choice="neither">Neither</button>
            </div>
          </fieldset>

          <div class="dog-breed-actions">
            <a class="back-button" href="cat-activity-level.html">Back</a>
            <button class="questionnaire-next" id="household-next" type="button" disabled>Next</button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const choiceButtons = document.querySelectorAll(".choice-option");
      const nextButton = document.querySelector("#household-next");
      const progressCount = document.querySelector("#progress-count");
      const progressBar = document.querySelector(".progress-track");
      const progressFill = document.querySelector(".progress-fill");
      const storageKeys = {
        children: "selectedChildrenUnderTwelve",
        "other-pets": "selectedOtherPets",
        "yard-walks": "selectedYardOrWalks",
      };

      function refreshProgress() {
        const answeredCount = Object.values(storageKeys).filter((key) => localStorage.getItem(key)).length;
        const percentage = Math.round((answeredCount / 3) * 100);
        progressCount.textContent = `${percentage}%`;
        progressBar.setAttribute("aria-valuenow", percentage);
        progressFill.style.height = `${percentage}%`;
        nextButton.disabled = answeredCount < 3;
      }

      choiceButtons.forEach((button) => {
        const storageKey = storageKeys[button.dataset.group];
        if (button.dataset.choice === localStorage.getItem(storageKey)) button.classList.add("is-selected");
        button.addEventListener("click", () => {
          document.querySelectorAll(`[data-group="${button.dataset.group}"]`).forEach((option) => option.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem(storageKey, button.dataset.choice);
          refreshProgress();
        });
      });

      nextButton.addEventListener("click", () => {
        if (!nextButton.disabled) window.location.href = "rank-answers.html";
      });
      refreshProgress();
    </script>
    <script type="module" src="./src/questionnaire-back.js"></script>
  </body>
</html>
