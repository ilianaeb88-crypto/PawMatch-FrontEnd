<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Cat Weight</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page weight-choice-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>What Weight of Cat Would You Prefer?</h1>

        <div class="choice-options weight-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="0-5">0-5 Pounds</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="5-10">5-10 Pounds</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="10-15">10-15 Pounds</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="15-20">15-20 Pounds</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="greater-than-25">Greater than 25 Pounds</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="no-preference">No Preference</button>
        </div>

        <a class="back-button" href="cat-age.html">Back</a>
      </main>
    </div>

    <script>
      const weightButtons = document.querySelectorAll(".choice-option");
      const savedWeight = localStorage.getItem("selectedCatWeight");

      weightButtons.forEach((button) => {
        if (button.dataset.choice === savedWeight) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          weightButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedCatWeight", button.dataset.choice);
          window.location.href = "cat-breed.html";
        });
      });
    </script>
  </body>
</html>
