<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Other Pets</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page other-pets-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="#" class="nav-item">Best Matches</a>
          <a href="#" class="nav-item auth-link">Sign In</a>
          <a href="#" class="nav-item auth-link auth-link-strong">Create an Account</a>
        </nav>
      </header>

      <main class="choice-bubble">
        <h1>Do You Have a Cat and/or Dog?</h1>

        <div class="choice-options" role="list">
          <button class="choice-option choice-option-primary" type="button" data-choice="cat">I Have a Cat(s)</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="dog">I Have a Dog(s)</button>
          <button class="choice-option choice-option-primary" type="button" data-choice="dog-and-cat">I Have a Dog(s) and Cat(s)</button>
          <button class="choice-option choice-option-secondary" type="button" data-choice="neither">I Have Neither Dogs Nor Cats</button>
        </div>

        <a class="back-button" href="children.html">Back</a>
      </main>
    </div>

    <script>
      const otherPetsButtons = document.querySelectorAll(".choice-option");
      const savedOtherPets = localStorage.getItem("selectedOtherPets");

      otherPetsButtons.forEach((button) => {
        if (button.dataset.choice === savedOtherPets) {
          button.classList.add("is-selected");
        }

        button.addEventListener("click", () => {
          otherPetsButtons.forEach((btn) => btn.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedOtherPets", button.dataset.choice);
          window.location.href = "rank-answers.html";
        });
      });
    </script>
  </body>
</html>
