<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Choose Cat Breed</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page breed-choice-page combined-questionnaire-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="available-pets.html" class="nav-item">Available Pets</a>
        </nav>
      </header>

      <main class="combined-questionnaire">
        <aside class="questionnaire-progress" aria-label="Questionnaire progress">
          <h1>Your perfect match starts here.</h1>
          <div class="progress-track" role="progressbar" aria-label="Questionnaire progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="progress-fill"></span>
          </div>
          <p class="progress-count" id="progress-count">0% Complete</p>
        </aside>

        <section class="questionnaire-panel">
          <h1>Tell Us More About Your Ideal Cat</h1>

        <label class="breed-label" for="cat-breed">Select a breed</label>
        <div class="breed-dropdown">
        <select class="breed-select" id="cat-breed">
          <option value="" disabled selected>Choose a cat breed</option>
          <option>Abyssinian</option>
          <option>American Bobtail</option>
          <option>American Curl</option>
          <option>American Shorthair</option>
          <option>American Wirehair</option>
          <option>Australian Mist</option>
          <option>Balinese</option>
          <option>Bengal</option>
          <option>Birman</option>
          <option>Bombay</option>
          <option>British Shorthair</option>
          <option>Burmese</option>
          <option>Burmilla</option>
          <option>Chartreux</option>
          <option>Colorpoint Shorthair</option>
          <option>Cornish Rex</option>
          <option>Cymric</option>
          <option>Devon Rex</option>
          <option>Egyptian Mau</option>
          <option>European Shorthair</option>
          <option>Exotic Shorthair</option>
          <option>Havana Brown</option>
          <option>Himalayan</option>
          <option>Japanese Bobtail</option>
          <option>Javanese</option>
          <option>Korat</option>
          <option>LaPerm</option>
          <option>Maine Coon</option>
          <option>Manx</option>
          <option>Munchkin</option>
          <option>Nebelung</option>
          <option>Norwegian Forest Cat</option>
          <option>Ocicat</option>
          <option>Oriental Shorthair</option>
          <option>Persian</option>
          <option>Peterbald</option>
          <option>Ragamuffin</option>
          <option>Ragdoll</option>
          <option>Russian Blue</option>
          <option>Safari</option>
          <option>Savannah</option>
          <option>Scottish Fold</option>
          <option>Selkirk Rex</option>
          <option>Siamese</option>
          <option>Siberian</option>
          <option>Singapura</option>
          <option>Somali</option>
          <option>Sphynx</option>
          <option>Thai</option>
          <option>Tonkinese</option>
          <option>Turkish Angora</option>
          <option>Turkish Van</option>
          <option>Mixed Breed</option>
          <option>No Preference</option>
        </select>
        </div>

          <fieldset class="question-group breed-weight-group">
            <legend>What weight of cat would you prefer?</legend>
            <div class="question-options question-options-three">
              <button class="choice-option choice-option-primary" type="button" data-weight="0-5">0-5 Pounds</button>
              <button class="choice-option choice-option-secondary" type="button" data-weight="5-10">5-10 Pounds</button>
              <button class="choice-option choice-option-primary" type="button" data-weight="10-15">10-15 Pounds</button>
              <button class="choice-option choice-option-secondary" type="button" data-weight="15-20">15-20 Pounds</button>
              <button class="choice-option choice-option-primary" type="button" data-weight="greater-than-25">Greater than 25 Pounds</button>
              <button class="choice-option choice-option-secondary" type="button" data-weight="no-preference">No Preference</button>
            </div>
          </fieldset>

        <div class="dog-breed-actions">
          <a class="back-button" href="adoption-choice.html">Back</a>
          <button class="questionnaire-next" id="cat-breed-next" type="button" disabled>Next</button>
        </div>
        </section>
      </main>
    </div>

    <script>
      const breedSelect = document.querySelector("#cat-breed");
      const breedDropdown = breedSelect.closest(".breed-dropdown");
      const breedTrigger = document.createElement("button");
      const breedMenu = document.createElement("div");
      const weightButtons = document.querySelectorAll("[data-weight]");
      const nextButton = document.querySelector("#cat-breed-next");
      localStorage.removeItem("selectedCatWeight");
      localStorage.removeItem("selectedCatBreed");
      const savedBreed = localStorage.getItem("selectedCatBreed");
      const progressCount = document.querySelector("#progress-count");
      const progressBar = document.querySelector(".progress-track");
      const progressFill = document.querySelector(".progress-fill");

      function refreshProgress() {
        const answeredCount = ["selectedCatWeight", "selectedCatBreed"]
          .filter((key) => localStorage.getItem(key)).length;
        const percentage = answeredCount * 50;
        progressCount.textContent = `${percentage}% Complete`;
        progressBar.setAttribute("aria-valuenow", percentage);
        progressFill.style.height = `${percentage}%`;
        nextButton.disabled = answeredCount < 2;
      }

      weightButtons.forEach((button) => {
        button.addEventListener("click", () => {
          weightButtons.forEach((weightButton) => weightButton.classList.remove("is-selected"));
          button.classList.add("is-selected");
          localStorage.setItem("selectedCatWeight", button.dataset.weight);
          refreshProgress();
        });
      });

      progressCount.textContent = "0% Complete";
      progressBar.setAttribute("aria-valuenow", "0");
      progressFill.style.height = "0%";

      if (savedBreed) {
        breedSelect.value = savedBreed;
      }

      breedTrigger.className = "breed-trigger";
      breedTrigger.type = "button";
      breedTrigger.textContent = breedSelect.value || "Choose a cat breed";
      breedMenu.className = "breed-menu";
      breedMenu.hidden = true;

      Array.from(breedSelect.options).forEach((option) => {
        if (option.disabled) return;
        const optionButton = document.createElement("button");
        optionButton.className = "breed-menu-option";
        optionButton.type = "button";
        optionButton.textContent = option.textContent;
        optionButton.addEventListener("click", () => {
          breedSelect.value = option.value;
          breedTrigger.textContent = option.textContent;
          breedMenu.hidden = true;
          localStorage.setItem("selectedCatBreed", breedSelect.value);
          refreshProgress();
        });
        breedMenu.append(optionButton);
      });

      breedDropdown.prepend(breedTrigger);
      breedDropdown.append(breedMenu);
      breedTrigger.addEventListener("click", () => {
        breedMenu.hidden = !breedMenu.hidden;
      });
      document.addEventListener("click", (event) => {
        if (!breedDropdown.contains(event.target)) breedMenu.hidden = true;
      });

      nextButton.addEventListener("click", () => {
        if (nextButton.disabled) return;
        window.location.href = breedSelect.value === "No Preference"
          ? "cat-hair-length.html"
          : "cat-activity-level.html";
      });
    </script>
  </body>
</html>
