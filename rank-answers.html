<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Rank Your Answers Based on Importance</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page ranking-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand">
          <img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" />
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="available-pets.html" class="nav-item">Available Pets</a>
        </nav>
      </header>

      <main class="choice-bubble ranking-bubble">
        <h1>Rank Your Answers Based on Importance</h1>
        <p class="ranking-instructions">Drag Each Answer Into Order, from Least to Greatest</p>
        <div class="ranking-list" id="ranking-list"></div>
        <a class="back-button" href="children-other-pets.html">Back</a>
        <a class="back-button done-button" href="questionnaire-complete.html">Done</a>
      </main>
    </div>

    <script>
      const answerDefinitions = [
        { key: "selectedGender", label: "Gender", values: { male: "Male", female: "Female", any: "No Preference" } },
        { key: "selectedAge", label: "Age", values: { "less-than-6-months": "0-1 (Baby)", "1-3": "1-3 (Young)", "3-7": "3-7 (Adult)", "greater-than-7": "Greater than 7 (Senior)" } },
        { key: "selectedWeight", label: "Weight", format: (value) => `${value.replaceAll("greater-than-", "Greater than ")} Pounds` },
        { key: "selectedCatWeight", label: "Weight", format: (value) => `${value.replaceAll("greater-than-", "Greater than ")} Pounds` },
        { key: "selectedDogBreed", label: "Breed" },
        { key: "selectedCatBreed", label: "Breed" },
        { key: "selectedDogHairLength", label: "Hair Length", values: { "long-hair": "Long-Hair", "short-hair": "Short-Hair" } },
        { key: "selectedCatHairLength", label: "Hair Length", values: { "long-hair": "Long-Hair", "short-hair": "Short-Hair" } },
        { key: "selectedDogActivity", label: "Activity Level", values: { "very-active": "Very Active", "moderately-active": "Moderately Active", "non-active": "Non-Active" } },
        { key: "selectedCatActivity", label: "Activity Level", values: { "very-active": "Very Active", "moderately-active": "Moderately Active", "non-active": "Non-Active" } },
        { key: "selectedDogHouseTraining", label: "House Training", values: { yes: "Yes, House Trained", no: "No Preference" } },
        { key: "selectedCatHouseTraining", label: "House Training", values: { yes: "Yes, House Trained", no: "No Preference" } },
        { key: "selectedDogDisability", label: "Disability", values: { "not-disabled": "Not Disabled", "any-disability": "Any Disability" } },
        { key: "selectedCatDisability", label: "Disability", values: { "not-disabled": "Not Disabled", "any-disability": "Any Disability" } },
        { key: "selectedDogType", label: "Dog Group" },
        { key: "selectedDogProtective", label: "Protectivity", values: { protective: "Protective", "not-protective": "Not Protective" } },
        { key: "selectedDogBarking", label: "Barking", values: { "does-not-matter": "Barking Does Not Matter", "does-not-bark": "Does Not Bark a Lot" } },
        { key: "selectedDogShedding", label: "Shedding", values: { "does-not-shed": "Does Not Shed", "shedding-does-not-matter": "Shedding Does Not Matter" } },
        { key: "selectedDogPersonality", label: "Personality", values: { social: "Social", reserved: "Reserved" } },
        { key: "selectedCatPersonality", label: "Personality", values: { social: "Social", reserved: "Reserved" } },
      ];

      const rankingList = document.querySelector("#ranking-list");
      const savedRanks = JSON.parse(localStorage.getItem("answerRanks") || "{}");
      const selectedPet = localStorage.getItem("selectedPet");

      function getAnswerLabel(definition, value) {
        if (definition.values && definition.values[value]) return definition.values[value];
        if (definition.format) return definition.format(value);
        return value.replaceAll("-", " ");
      }

      function isNoPreferenceAnswer(definition, value) {
        const normalizedValue = value.trim().toLowerCase();
        const answerLabel = getAnswerLabel(definition, value).trim().toLowerCase();
        return normalizedValue === "any"
          || normalizedValue === "no-preference"
          || answerLabel === "no preference";
      }

      function matchesSelectedPet(definition) {
        if (definition.key === "selectedWeight" || definition.key.startsWith("selectedDog")) {
          return selectedPet === "dog";
        }
        if (definition.key.startsWith("selectedCat")) {
          return selectedPet === "cat";
        }
        return true;
      }

      const answers = answerDefinitions
        .map((definition) => ({
          ...definition,
          value: localStorage.getItem(definition.key),
        }))
        .filter((definition) => matchesSelectedPet(definition)
          && definition.value
          && !isNoPreferenceAnswer(definition, definition.value))
        .map((definition) => ({
          ...definition,
          answerLabel: definition.label,
        }));

      answers.sort((first, second) => (savedRanks[first.key] || 99) - (savedRanks[second.key] || 99));

      function saveRanks() {
        rankingList.querySelectorAll(".rank-item").forEach((item, index) => {
          savedRanks[item.dataset.answerKey] = index + 1;
          item.querySelector(".rank-value").textContent = index + 1;
        });
        localStorage.setItem("answerRanks", JSON.stringify(savedRanks));
      }

      function updateDropTarget(target, draggedItem) {
        const targetBox = target.getBoundingClientRect();
        const insertBefore = draggedItem.clientY < targetBox.top + targetBox.height / 2;
        rankingList.insertBefore(draggedItem.item, insertBefore ? target : target.nextSibling);
        saveRanks();
      }

      answers.forEach((answer) => {
        const item = document.createElement("div");
        item.className = "rank-item";
        item.dataset.answerKey = answer.key;
        item.draggable = true;
        item.innerHTML = `<span class="rank-value" aria-label="Importance rank"></span>
          <span class="rank-answer">${answer.answerLabel}</span>
          <span class="rank-drag-handle" aria-hidden="true">☷</span>`;

        item.addEventListener("dragstart", (event) => {
          item.classList.add("is-dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", answer.key);
        });
        item.addEventListener("dragend", () => {
          item.classList.remove("is-dragging");
          document.querySelectorAll(".rank-item").forEach((rankItem) => rankItem.classList.remove("is-drop-target"));
        });
        item.addEventListener("dragover", (event) => {
          event.preventDefault();
          if (item !== document.querySelector(".is-dragging")) item.classList.add("is-drop-target");
        });
        item.addEventListener("dragleave", () => item.classList.remove("is-drop-target"));
        item.addEventListener("drop", (event) => {
          event.preventDefault();
          const draggedItem = document.querySelector(".is-dragging");
          if (!draggedItem || draggedItem === item) return;
          updateDropTarget(item, { item: draggedItem, clientY: event.clientY });
          item.classList.remove("is-drop-target");
        });

        rankingList.append(item);
      });

      saveRanks();

      if (!answers.length) {
        rankingList.innerHTML = "<p class=\"ranking-empty\">No ranked answers are available yet.</p>";
      }
    </script>
    <script type="module" src="./src/questionnaire-back.js"></script>
  </body>
</html>
