<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Rank Your Answers</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page ranking-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-name">Pawmatch</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Questionnaire</a>
          <a href="available-pets.html" class="nav-item">Available Pets</a>
        </nav>
      </header>

      <main class="choice-bubble ranking-bubble">
        <h1>Rank Your Answers Based On Their Importance 1-15</h1>
        <div class="rank-number-strip" id="rank-number-strip" aria-label="Choose an importance rank"></div>
        <div class="ranking-list" id="ranking-list"></div>
        <a class="back-button" href="children-other-pets.html">Back</a>
        <a class="back-button done-button" href="questionnaire-complete.html">Done</a>
      </main>
    </div>

    <script>
      const answerDefinitions = [
        { key: "selectedPath", label: "Looking to", values: { foster: "Foster", adopt: "Adopt" } },
        { key: "selectedPet", label: "Pet", values: { cat: "Cat", dog: "Dog" } },
        { key: "selectedGender", label: "Gender", values: { male: "Male", female: "Female", any: "No Preference" } },
        { key: "selectedAge", label: "Age", values: { "less-than-6-months": "0-1 (Baby)", "1-3": "1-3 (Young)", "3-7": "3-7 (Adult)", "greater-than-7": "Greater than 7 (Senior)" } },
        { key: "selectedWeight", label: "Weight", format: (value) => `${value.replaceAll("greater-than-", "Greater than ")} Pounds` },
        { key: "selectedCatWeight", label: "Cat Weight", format: (value) => `${value.replaceAll("greater-than-", "Greater than ")} Pounds` },
        { key: "selectedDogBreed", label: "Dog Breed" },
        { key: "selectedCatBreed", label: "Cat Breed" },
        { key: "selectedDogHairLength", label: "Dog Hair Length", values: { "long-hair": "Long-Hair", "short-hair": "Short-Hair" } },
        { key: "selectedCatHairLength", label: "Cat Hair Length", values: { "long-hair": "Long-Hair", "short-hair": "Short-Hair" } },
        { key: "selectedDogActivity", label: "Dog Activity", values: { "very-active": "Very Active", "moderately-active": "Moderately Active", "non-active": "Non-Active" } },
        { key: "selectedCatActivity", label: "Cat Activity", values: { "very-active": "Very Active", "moderately-active": "Moderately Active", "non-active": "Non-Active" } },
        { key: "selectedDogHouseTraining", label: "Dog House Training", values: { yes: "Yes, House Trained", no: "No Preference" } },
        { key: "selectedCatHouseTraining", label: "Cat House Training", values: { yes: "Yes, House Trained", no: "No Preference" } },
        { key: "selectedDogDisability", label: "Dog Disability", values: { "not-disabled": "Not Disabled", "any-disability": "Any Disability" } },
        { key: "selectedCatDisability", label: "Cat Disability", values: { "not-disabled": "Not Disabled", "any-disability": "Any Disability" } },
        { key: "selectedDogType", label: "Dog Group" },
        { key: "selectedDogProtective", label: "Protective Dog", values: { protective: "Protective", "not-protective": "Not Protective" } },
        { key: "selectedDogBarking", label: "Barking", values: { "does-not-matter": "Barking Does Not Matter", "does-not-bark": "Does Not Bark a Lot" } },
        { key: "selectedDogShedding", label: "Shedding", values: { "does-not-shed": "Does Not Shed", "shedding-does-not-matter": "Shedding Does Not Matter" } },
        { key: "selectedDogPersonality", label: "Dog Personality", values: { social: "Social", reserved: "Reserved" } },
        { key: "selectedCatPersonality", label: "Cat Personality", values: { social: "Social", reserved: "Reserved" } },
        { key: "selectedChildrenUnderTwelve", label: "Children 12 or Under", values: { yes: "Yes", no: "No" } },
        { key: "selectedOtherPets", label: "Other Pets", values: { cat: "I Have a Cat(s)", dog: "I Have a Dog(s)", "dog-and-cat": "I Have a Dog(s) and Cat(s)", neither: "I Have Neither Dogs Nor Cats" } },
      ];

      const noPreferenceValues = new Set(["any", "no-preference", "No Preference", "no preference"]);
      const rankingList = document.querySelector("#ranking-list");
      const savedRanks = JSON.parse(localStorage.getItem("answerRanks") || "{}");
      let activeAnswerKey = null;
      const rankNumberStrip = document.querySelector("#rank-number-strip");

      Array.from({ length: 15 }, (_, index) => index + 1).forEach((rank) => {
        const rankButton = document.createElement("button");
        rankButton.className = "rank-number";
        rankButton.type = "button";
        rankButton.textContent = rank;
        rankButton.addEventListener("click", () => {
          if (!activeAnswerKey) return;
          savedRanks[activeAnswerKey] = rank;
          localStorage.setItem("answerRanks", JSON.stringify(savedRanks));
          const activeItem = document.querySelector(`[data-answer-key="${activeAnswerKey}"]`);
          activeItem.querySelector(".rank-value").textContent = rank;
          activeItem.classList.remove("is-active");
          rankNumberStrip.querySelectorAll(".rank-number").forEach((button) => button.classList.remove("is-active"));
          activeAnswerKey = null;
        });
        rankNumberStrip.append(rankButton);
      });

      function getAnswerLabel(definition, value) {
        if (definition.values && definition.values[value]) return definition.values[value];
        if (definition.format) return definition.format(value);
        return value.replaceAll("-", " ");
      }

      const answers = answerDefinitions
        .map((definition) => ({
          ...definition,
          value: localStorage.getItem(definition.key),
        }))
        .filter((definition) => definition.value && !noPreferenceValues.has(definition.value))
        .map((definition) => ({
          ...definition,
          answerLabel: getAnswerLabel(definition, definition.value),
        }));

      answers.forEach((answer) => {
        const item = document.createElement("div");
        item.className = "rank-item";
        item.dataset.answerKey = answer.key;
        item.innerHTML = `<div class="rank-answer">
            <button class="rank-answer-button" type="button">${answer.answerLabel}</button>
            <span class="rank-value" aria-label="Assigned rank">${savedRanks[answer.key] || ""}</span>
          </div>`;

        item.querySelector(".rank-answer-button").addEventListener("click", () => {
          document.querySelectorAll(".rank-item").forEach((answerItem) => answerItem.classList.remove("is-active"));
          rankNumberStrip.querySelectorAll(".rank-number").forEach((button) => button.classList.remove("is-active"));
          item.classList.add("is-active");
          activeAnswerKey = answer.key;
        });

        rankingList.append(item);
      });

      if (!answers.length) {
        rankingList.innerHTML = "<p class=\"ranking-empty\">No ranked answers are available yet.</p>";
      }
    </script>
  </body>
</html>
