<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Password</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page profile-settings-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand"><img class="brand-icon" src="./src/assets/image copy 17.png" alt="" aria-hidden="true" /><span class="brand-name">Pawmatch</span></a>
        <nav class="nav-links" aria-label="Primary navigation"><a href="adoption-choice.html" class="nav-item">Questionnaire</a><a href="match-results.html" class="nav-item">Best Matches</a><a href="available-pets.html" class="nav-item">Available Pets</a></nav>
      </header>
      <main class="profile-settings-layout">
        <aside class="profile-settings-sidebar" aria-label="Profile settings navigation">
          <a class="profile-settings-nav" href="profile.html">Profile</a>
          <a class="profile-settings-nav" href="notifications.html">Notifications</a>
          <a class="profile-settings-nav is-active" href="password.html" aria-current="page">Password</a>
          <a class="profile-settings-nav" id="liked-pets-tab" href="liked-pets.html">Saved Pets</a>
          <button class="profile-settings-nav logout-button" id="logout-button" type="button">Log Out</button>
        </aside>
        <section class="profile-settings-content">
          <form class="profile-settings-card" id="password-form">
            <div class="profile-settings-card-heading">
              <div>
                <h1>Change Password</h1>
                <p>Set a new password for your account.</p>
              </div>
              <button class="profile-save-button" type="submit">Update password</button>
            </div>

            <div class="profile-form-grid profile-password-grid">
              <label>Current password<span class="password-field"><input type="password" name="current-password" required /><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"></button></span></label>
              <label>New password<span class="password-field"><input type="password" name="new-password" minlength="8" required /><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"></button></span></label>
            </div>
            <p class="profile-form-message" id="password-message" role="alert" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>
    <script>
      document.querySelectorAll(".password-toggle").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const input = toggle.previousElementSibling;
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          toggle.setAttribute("aria-pressed", String(show));
          toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
      });

      document.querySelector("#password-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const account = JSON.parse(localStorage.getItem("pawmatchAccount") || "null");
        const message = document.querySelector("#password-message");
        if (!account || account.password !== form.elements["current-password"].value) {
          message.textContent = "The current password does not match our records.";
          return;
        }
        account.password = form.elements["new-password"].value;
        localStorage.setItem("pawmatchAccount", JSON.stringify(account));
        message.textContent = "Password updated.";
        form.reset();
      });
    </script>
    <script type="module" src="./src/nav-feedback.js"></script>
  </body>
</html>
