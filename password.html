<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawmatch - Password</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="choice-page profile-settings-page">
    <div class="choice-shell">
      <header class="topbar choice-topbar">
        <a href="home.html" class="brand"><span class="brand-icon" aria-hidden="true">🐾</span><span class="brand-name">Pawmatch</span></a>
        <nav class="nav-links" aria-label="Primary navigation"><a href="profile.html" class="nav-item">Profile</a><a href="available-pets.html" class="nav-item">Available Pets</a></nav>
      </header>
      <main class="profile-settings-layout">
        <aside class="profile-settings-sidebar" aria-label="Profile settings navigation">
          <a class="profile-settings-nav" href="profile.html">Profile</a>
          <a class="profile-settings-nav is-active" href="password.html">Password</a>
          <a class="profile-settings-nav" href="liked-pets.html">Liked Pets</a>
        </aside>
        <section class="profile-settings-content">
          <section class="profile-settings-card">
            <h1>Change Password</h1>
            <p>Set a new password for your account.</p>
            <form class="profile-password-form" id="password-form">
              <label>Current password<input type="password" name="current-password" required /></label>
              <label>New password<input type="password" name="new-password" minlength="8" required /></label>
              <button class="profile-save-button" type="submit">Update password</button>
            </form>
            <p class="profile-form-message" id="password-message" role="alert" aria-live="polite"></p>
          </section>
        </section>
      </main>
    </div>
    <script>
      document.querySelector("#password-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const account = JSON.parse(localStorage.getItem("pawmatchAccount") || "null");
        const message = document.querySelector("#password-message");
        if (!account || account.password !== form.elements["current-password"].value) {
          message.textContent = "The current password does not match our records.";
          return;
        }
        account.password = form.elements["new-password"].value;
        localStorage.setItem("pawmatchAccount", JSON.stringify(account));
        message.textContent = "Password updated.";
        form.reset();
      });
    </script>
  </body>
</html>
